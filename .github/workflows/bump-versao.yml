name: Bump de versão

# Roda depois do merge (squash) de uma PR em develop — o commit resultante
# carrega o mesmo prefixo Conventional Commits do título da PR (CLAUDE.md).
# Critério: feat: -> minor, fix: -> patch, qualquer outro tipo (chore/docs/
# refactor/test/build/ci) não bumpa. O salto pra 1.0.0 (primeiro lançamento
# em produção) é sempre manual — ver seção "Versionamento" do CLAUDE.md.
#
# `develop` é branch protegida (só aceita mudança via PR) — por isso o bump
# não dá push direto: abre uma PR própria ("chore(release): ..."), que você
# aprova/mergeia como qualquer outra. O guard abaixo evita que o merge dessa
# PR dispare um novo bump (loop infinito).
on:
  push:
    branches:
      - develop

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determina o tipo de bump pelo prefixo do commit
        id: tipo
        env:
          MENSAGEM_DO_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MENSAGEM_DO_COMMIT" =~ ^feat(\(.+\))?:\  ]]; then
            echo "release_as=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$MENSAGEM_DO_COMMIT" =~ ^fix(\(.+\))?:\  ]]; then
            echo "release_as=patch" >> "$GITHUB_OUTPUT"
          else
            echo "release_as=" >> "$GITHUB_OUTPUT"
          fi

      - name: Instala dependências
        if: steps.tipo.outputs.release_as != ''
        run: npm ci

      - name: Bump de versão (só nos arquivos, sem commit/tag — a PR cuida disso)
        if: steps.tipo.outputs.release_as != ''
        run: npx commit-and-tag-version --release-as ${{ steps.tipo.outputs.release_as }} --skip.commit --skip.tag

      - name: Lê a versão resultante
        if: steps.tipo.outputs.release_as != ''
        id: versao
        run: echo "numero=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Abre PR com o bump
        if: steps.tipo.outputs.release_as != ''
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(release): bump versão para ${{ steps.versao.outputs.numero }}"
          title: "chore(release): bump versão para ${{ steps.versao.outputs.numero }}"
          body: >
            Bump automático (${{ steps.tipo.outputs.release_as }}) gerado a partir do commit
            ${{ github.sha }}. Mergear normalmente.
          branch: chore/bump-versao-${{ steps.versao.outputs.numero }}
          base: develop
          delete-branch: true
          add-paths: |
            package.json
            app.json
