appId: com.danielfalcaodf.repor
---
# Edição de produto existente (F5, capability `cadastro-de-produto`,
# delta de edição PR-05/PR-10, `app/produto/[id].tsx`): cobre o caminho
# que só tinha teste de lógica (`useEditarProduto`, `hooks.test.ts:122,130`)
# e nenhum flow E2E — não existe uma tela "editar" separada, o detalhe do
# produto (aberto ao tocar num item da Despensa) já mostra o mesmo
# `FormularioProduto` preenchido e editável inline (nome, categoria,
# quantidade necessária); a quantidade ATUAL não é um campo desse
# formulário, só o toque no número grande no topo (rótulo acessível
# "Corrigir quantidade atual") abre esse outro fluxo, fora de escopo aqui.
#
# Usa "Item Teste QA F5" (criado por `cadastro-de-produto.yaml`) por ser o
# item de baixo risco reservado para esse tipo de manipulação. Se ele não
# existir mais no seu dispositivo, rode `cadastro-de-produto.yaml` primeiro
# ou troque o nome abaixo por outro produto de teste.
#
# Desde a change correcao-autofoco-detalhe-produto (ACHADO-056), o detalhe
# abre SEM autofoco e sem teclado: o primeiro toque em "Repus" precisa
# funcionar de imediato (KPI K4) — o flow prova isso tocando "Repus" logo
# após abrir a tela e desfazendo em seguida para não deixar efeito
# colateral. O botão "Salvar" nasce fora da viewport dentro do ScrollView
# do formulário, por isso o `scrollUntilVisible` antes do toque.
#
# Efeito colateral real, não destrutivo mas permanente: altera a
# "quantidade necessária" de "Item Teste QA F5" de 3 para 5 un no banco do
# dispositivo de teste (nome e demais campos ficam iguais). O item
# continua no estado "Acabou" (0 de 5 un).
- launchApp
- assertVisible: "Despensa"
- tapOn: "Buscar"
- inputText: "Item Teste QA F5"
- hideKeyboard
# O regex casa só com o rótulo da linha (com estado), nunca com o texto
# digitado no campo de busca.
- tapOn: "Item Teste QA F5, 0 de .*"
# Sem autofoco o teclado não sobe sozinho: se subisse, este toque acertaria
# o IME e o "Desfazer" abaixo nunca apareceria (prova do ACHADO-056).
- tapOn: "Repus"
- assertVisible: "Desfazer"
- tapOn: "Desfazer"
- assertVisible: "Quanto quero ter em casa"
- tapOn: "Quanto quero ter em casa"
- eraseText: 5
- inputText: "5"
- hideKeyboard
- scrollUntilVisible:
    element: "Salvar"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Salvar"
- assertVisible: "Despensa"
- assertVisible: "Item Teste QA F5, 0 de 5 un, Acabou"
