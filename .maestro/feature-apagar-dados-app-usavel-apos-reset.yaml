appId: com.danielfalcaodf.repor
---
# Change `feature-apagar-todos-os-dados` (ordem 8) — cenário 4/5.
#
# RISCO CENTRAL DO DESIGN: o reset apaga as tabelas de dado mas precisa
# preservar/recriar `casa` e `usuario` (`garantirCasaEUsuario` no fim da
# mesma transação). Se isso falhar, o app fica sem identidade local e só
# volta a funcionar depois de um reinício — ou nem isso. Nenhum teste de
# infra prova isso do ponto de vista de quem usa o app.
#
# O QUE ESTE FLOW PROVA: logo depois do reset, SEM reiniciar o app, dá para
# cadastrar um produto novo e ele aparece na despensa. Cobre "App continua
# funcional após o reset". No fim, reinicia o app e confirma que o produto
# novo continua lá (a identidade recriada foi mesmo persistida).
#
# ⚠️ FLOW DESTRUTIVO — APAGA TODOS OS DADOS DO DISPOSITIVO DE TESTE.
#
# NÃO EXECUTADO AINDA — seletores lidos do código-fonte, não confirmados com
# `inspect_screen`.

- launchApp
- assertVisible: "Despensa"
# ambiente: bolha flutuante "Tools" do Expo dev-client sobrepoe os icones do topo
- swipe:
    start: "970, 173"
    end: "540, 700"
    duration: 600

# --- Reset --------------------------------------------------------------
- tapOn: "Configurações"
- scrollUntilVisible:
    element: "Apagar todos os dados"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Apagar todos os dados"
- tapOn: "Apagar tudo"
- assertVisible: "Apagar todos os dados?"
- tapOn:
    text: "Apagar tudo"
    rightOf:
      text: "Manter meus dados"
- assertVisible: "Todos os dados foram apagados."

# --- Sem reiniciar: cadastrar um produto tem de funcionar --------------
- tapOn: "Despensa"
- assertVisible: "Nada cadastrado ainda. Comece pelos 40 itens que quase toda casa tem — depois é só ajustar."
- tapOn: "Cadastrar do zero"
- assertVisible: "Novo produto"
- setClipboard: "QA Pos Reset"
- pasteText
- tapOn: "un"
- tapOn: "Quanto quero ter em casa"
- inputText: "3"
- tapOn: "Adicionar à despensa"
- assertVisible: "Despensa"
- assertVisible: "QA Pos Reset, 0 de 3 un, Acabou"

# --- E o dado gravado depois do reset sobrevive ao reinício ------------
- stopApp
- launchApp
- assertVisible: "Despensa"
- assertVisible: "QA Pos Reset, 0 de 3 un, Acabou"
