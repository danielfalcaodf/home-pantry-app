appId: com.danielfalcaodf.repor
---
# Change `correcao-sheets-ajuste-sem-autofoco` (ordem 5) — cenário 5/5.
#
# REGRESSÃO DOS VIZINHOS: os outros 3 sheets do padrão `PainelInferior`
# (`teclado-quantidade`, `sheet-preco-produto`, `sheet-avulso`) já tinham
# `autoFocus` de uma change anterior. A change 5 mexe no mesmo padrão de
# componente; se alguém "unificar" o foco no `PainelInferior` mais tarde, é
# aqui que a quebra aparece.
#
# O QUE ESTE FLOW PROVA: nos três sheets, o primeiro campo abre focado, o
# teclado sobe junto, e digitar sem tocar no campo ainda funciona (task 3.1
# da change).
#
# SELETOR DO TECLADO: id `<pacote-do-IME>:id/keyboard_view`, casado por
# regex porque o pacote varia (Gboard/AOSP). Confirmar com
# `maestro hierarchy` na primeira execução.
#
# NÃO EXECUTADO AINDA — seletores lidos do código-fonte, não confirmados com
# `inspect_screen`.
#
# Efeito colateral real e permanente: cria "QA Foco Vizinhos", grava um
# consumo nele pelo teclado de quantidade (com "Desfazer" logo em seguida),
# grava preço de R$ 3,00 no produto e adiciona um item avulso
# "QA Avulso Foco" à compra aberta.

- launchApp
- assertVisible: "Despensa"
# ambiente: bolha flutuante "Tools" do Expo dev-client sobrepoe os icones do topo
- swipe:
    start: "970, 173"
    end: "540, 700"
    duration: 600

# --- Preparo -----------------------------------------------------------
- runFlow:
    when:
      visible: "Cadastrar do zero"
    commands:
      - tapOn: "Cadastrar do zero"
- runFlow:
    when:
      notVisible: "Novo produto"
    commands:
      - tapOn: "Adicionar produto"
- assertVisible: "Novo produto"
- tapOn: "O que é"
- setClipboard: "QA Foco Vizinhos"
- pasteText
- tapOn: "un"
- tapOn: "Quanto quero ter em casa"
- inputText: "5"
- tapOn: "Adicionar à despensa"
- assertVisible: "Despensa"

# --- Sheet 1: teclado de quantidade ("Outra quantidade") ---------------
# Nota de ambiente: busca por texto multi-palavra é instável no teclado do
# AVD; despensa tem só este item, toca-se direto no rótulo acessível.
- tapOn: "QA Foco Vizinhos, 0 de 5 un, Acabou"
- tapOn: "Outra quantidade"
- assertVisible: "QA Foco Vizinhos"
- assertVisible:
    text: "Quantidade"
    focused: true
- assertVisible:
    id: ".*inputmethod.*:id/keyboard_view"
- takeScreenshot: autofoco-teclado-quantidade
- inputText: "2"
- tapOn: "Repus"
# A reposição só acontece se o "2" tiver caído no campo focado.
- assertVisible: "Desfazer"
- tapOn: "Desfazer"
- tapOn: "Voltar"
- assertVisible: "Despensa"

# --- Sheet 2: preço do produto (toque na linha da Lista) ---------------
- tapOn: "Lista"
- scrollUntilVisible:
    element: "Remover QA Foco Vizinhos da lista"
    direction: DOWN
    speed: 40
    timeout: 20000
- tapOn: "QA Foco Vizinhos"
- assertVisible: "Preço de QA Foco Vizinhos"
- assertVisible:
    text: "Quanto costuma custar"
    focused: true
- assertVisible:
    id: ".*inputmethod.*:id/keyboard_view"
- takeScreenshot: autofoco-preco-produto-teclado
- inputText: "300"
- tapOn: "Salvar"
# 5 un × R$ 3,00 — o preço só chega ao campo se o autoFocus estiver lá.
- assertVisible: "R\\$ 15,00"

# --- Sheet 3: item avulso ----------------------------------------------
- tapOn: "Adicionar item avulso"
- assertVisible: "Adicionar item avulso"
- assertVisible:
    text: "O que é"
    focused: true
- assertVisible:
    id: ".*inputmethod.*:id/keyboard_view"
- takeScreenshot: autofoco-avulso-teclado
- setClipboard: "QA Avulso Foco"
- pasteText
- tapOn: "Adicionar"
- scrollUntilVisible:
    element: "Remover QA Avulso Foco da lista"
    direction: DOWN
    speed: 40
    timeout: 20000
- assertVisible: "Remover QA Avulso Foco da lista"
