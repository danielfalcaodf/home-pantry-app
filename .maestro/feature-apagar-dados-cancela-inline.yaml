appId: com.danielfalcaodf.repor
---
# Change `feature-apagar-todos-os-dados` (ordem 8) — cenário 2/5.
#
# PRIMEIRA REDE DE SEGURANÇA: o toque no botão "Apagar todos os dados" NÃO
# pode apagar nada — ele só abre o painel de confirmação inline. Cancelar
# ali tem de devolver a tela ao estado anterior, sem tocar no banco.
#
# O QUE ESTE FLOW PROVA: abrir a confirmação e tocar "Cancelar" mantém todos
# os dados. Cobre "Cancelar a confirmação não apaga nada" pela primeira das
# duas camadas.
#
# NÃO DESTRUTIVO por design — mas basta um toque errado no botão vizinho
# para virar destrutivo, então rode com o mesmo cuidado dos outros flows
# desta change.
#
# NÃO EXECUTADO AINDA — seletores lidos do código-fonte, não confirmados com
# `inspect_screen`.
#
# Efeito colateral real: cria "QA Cancela Inline" na despensa (e o deixa lá,
# como prova de que nada foi apagado).

- launchApp
- assertVisible: "Despensa"
# ambiente: bolha flutuante "Tools" do Expo dev-client sobrepoe os icones do topo
- swipe:
    start: "970, 173"
    end: "540, 700"
    duration: 600

# --- Preparo -----------------------------------------------------------
- runFlow:
    when:
      visible: "Cadastrar do zero"
    commands:
      - tapOn: "Cadastrar do zero"
- runFlow:
    when:
      notVisible: "Novo produto"
    commands:
      - tapOn: "Adicionar produto"
- assertVisible: "Novo produto"
- tapOn: "O que é"
- setClipboard: "QA Cancela Inline"
- pasteText
- tapOn: "un"
- tapOn: "Quanto quero ter em casa"
- inputText: "2"
- tapOn: "Adicionar à despensa"
- assertVisible: "Despensa"

# --- Abre e cancela a confirmação inline -------------------------------
- tapOn: "Configurações"
- scrollUntilVisible:
    element: "Apagar todos os dados"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Apagar todos os dados"
- assertVisible: "Apagar todos os produtos, compras e histórico de movimentos? Essa ação não pode ser desfeita."
- tapOn: "Cancelar"

# --- Verificação: painel fechado e dados intactos ----------------------
- assertNotVisible: "Apagar todos os produtos, compras e histórico de movimentos? Essa ação não pode ser desfeita."
- assertNotVisible: "Todos os dados foram apagados."
- tapOn: "Despensa"
- assertVisible: "QA Cancela Inline, 0 de 2 un, Acabou"
