appId: com.danielfalcaodf.repor
---
# Change `feature-apagar-todos-os-dados` (ordem 8) — cenário 5/5.
#
# COBERTURA MAIS AMPLA DO RESET: "apagar todos os dados" tem de alcançar as
# tabelas que a Despensa não mostra — `compra`, `compra_item` e
# `movimento_estoque`. Um DELETE que esquecesse a compra ABERTA deixaria o
# app num estado pior que antes: itens de compra apontando para produtos que
# não existem mais (exatamente o defeito que a change 3 corrigiu por outro
# caminho).
#
# O QUE ESTE FLOW PROVA: com dado espalhado em três telas (produto na
# Despensa, item avulso e compra aberta na Lista, gasto no Resumo), o reset
# limpa tudo — inclusive a compra aberta e o histórico de compras.
#
# ⚠️ FLOW DESTRUTIVO — APAGA TODOS OS DADOS DO DISPOSITIVO DE TESTE, e antes
# disso FECHA uma compra de verdade (para haver gasto no histórico).
#
# NÃO EXECUTADO AINDA — seletores lidos do código-fonte, não confirmados com
# `inspect_screen`.

- launchApp
- assertVisible: "Despensa"
# ambiente: bolha flutuante "Tools" do Expo dev-client sobrepoe os icones do topo
- swipe:
    start: "970, 173"
    end: "540, 700"
    duration: 600

# --- Preparo: produto com preço ----------------------------------------
- runFlow:
    when:
      visible: "Cadastrar do zero"
    commands:
      - tapOn: "Cadastrar do zero"
- runFlow:
    when:
      notVisible: "Novo produto"
    commands:
      - tapOn: "Adicionar produto"
- assertVisible: "Novo produto"
- tapOn: "O que é"
- setClipboard: "QA Reset Amplo"
- pasteText
- tapOn: "un"
- tapOn: "Quanto quero ter em casa"
- inputText: "1"
- tapOn: "Mais opções"
- tapOn: "Quanto costuma custar"
- inputText: "500"
- tapOn: "Adicionar à despensa"
- assertVisible: "Despensa"

# --- Preparo: uma compra fechada (gera gasto e histórico) --------------
- tapOn: "Lista"
- tapOn:
    text: "Iniciar compra \\(\\d+\\)"
- assertVisible: "Compra"
- scrollUntilVisible:
    element: "QA Reset Amplo, 1 un, R\\$ 5,00"
    direction: DOWN
    speed: 40
    timeout: 20000
- tapOn: "QA Reset Amplo, 1 un, R\\$ 5,00"
- assertVisible:
    text: "QA Reset Amplo, 1 un, R\\$ 5,00"
    checked: true
- tapOn: "Fechar compra"
- assertVisible: "Despensa"

# --- Preparo: um item avulso numa compra ABERTA ------------------------
- tapOn: "Lista"
- tapOn: "Adicionar item avulso"
- assertVisible: "Adicionar item avulso"
- setClipboard: "QA Avulso Reset"
- pasteText
- tapOn: "Adicionar"
- assertVisible: "Remover QA Avulso Reset da lista"

# --- Reset --------------------------------------------------------------
- tapOn: "Configurações"
- scrollUntilVisible:
    element: "Apagar todos os dados"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Apagar todos os dados"
- tapOn: "Apagar tudo"
- assertVisible: "Apagar todos os dados?"
- tapOn:
    text: "Apagar tudo"
    rightOf:
      text: "Manter meus dados"
- assertVisible: "Todos os dados foram apagados."

# --- Verificação nas três telas ----------------------------------------
- tapOn: "Despensa"
- assertVisible: "Nada cadastrado ainda. Comece pelos 40 itens que quase toda casa tem — depois é só ajustar."

- tapOn: "Lista"
- assertVisible: "Nada faltando por aqui. Se quiser levar algo pontual para a próxima compra, adicione um item avulso."
- assertNotVisible: "Remover QA Avulso Reset da lista"

- tapOn: "Resumo"
- assertVisible: "Nenhuma compra fechada ainda. Assim que você fechar a primeira, o gasto do mês aparece aqui."
