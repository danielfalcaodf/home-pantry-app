appId: com.danielfalcaodf.repor
---
# Change `correcao-sheets-ajuste-sem-autofoco` (ordem 5) — cenário 3/5.
#
# BORDA DE CICLO DE VIDA: `autoFocus` é aplicado na montagem do campo. Se o
# sheet for apenas escondido (e não desmontado) ao fechar, a SEGUNDA
# abertura não recebe foco — bug clássico e invisível em teste unitário de
# uma renderização só. `sheet-ajuste-estoque` é montado condicionalmente
# (`ajusteAberto`), então este flow prova o ciclo abrir → fechar pelo "X" →
# abrir de novo.
#
# O QUE ESTE FLOW PROVA: na SEGUNDA abertura do sheet, o campo continua
# focado, o teclado sobe de novo, e digitar sem tocar no campo ainda
# funciona. O teclado é afirmado nas duas aberturas — fechar pelo "X" e
# reabrir é justamente quando o IME costuma ficar para trás.
#
# SELETOR DO TECLADO: id `<pacote-do-IME>:id/keyboard_view`, casado por
# regex porque o pacote varia (Gboard/AOSP). Confirmar com
# `maestro hierarchy` na primeira execução.
#
# NÃO EXECUTADO AINDA — seletores lidos do código-fonte, não confirmados com
# `inspect_screen`.
#
# Efeito colateral real e permanente: cria "QA Foco Reabre" e grava um
# movimento de ajuste (fica com 4 de 5 un).

- launchApp
- assertVisible: "Despensa"
# ambiente: bolha flutuante "Tools" do Expo dev-client sobrepoe os icones do topo
- swipe:
    start: "970, 173"
    end: "540, 700"
    duration: 600

# --- Preparo -----------------------------------------------------------
- runFlow:
    when:
      visible: "Cadastrar do zero"
    commands:
      - tapOn: "Cadastrar do zero"
- runFlow:
    when:
      notVisible: "Novo produto"
    commands:
      - tapOn: "Adicionar produto"
- assertVisible: "Novo produto"
- tapOn: "O que é"
- setClipboard: "QA Foco Reabre"
- pasteText
- tapOn: "un"
- tapOn: "Quanto quero ter em casa"
- inputText: "5"
- tapOn: "Adicionar à despensa"
- assertVisible: "Despensa"

# Nota de ambiente: busca por texto multi-palavra é instável no teclado do
# AVD; despensa tem só este item, toca-se direto no rótulo acessível.
- tapOn: "QA Foco Reabre, 0 de 5 un, Acabou"

# --- 1ª abertura: fecha pelo "X", sem salvar ---------------------------
- tapOn: "Corrigir quantidade atual"
- assertVisible: "Corrigir QA Foco Reabre"
- assertVisible:
    text: "Quanto você tem agora \\(un\\)"
    focused: true
- assertVisible:
    id: ".*inputmethod.*:id/keyboard_view"
- tapOn: "Fechar"
- assertNotVisible: "Corrigir QA Foco Reabre"

# --- 2ª abertura: o foco automático precisa continuar valendo ----------
- tapOn: "Corrigir quantidade atual"
- assertVisible: "Corrigir QA Foco Reabre"
- assertVisible:
    text: "Quanto você tem agora \\(un\\)"
    focused: true
- assertVisible:
    id: ".*inputmethod.*:id/keyboard_view"
- takeScreenshot: autofoco-reabertura-teclado
- eraseText: 5
- inputText: "4"
- tapOn: "Corrigir"

# --- Verificação -------------------------------------------------------
- tapOn: "Voltar"
- assertVisible: "Despensa"
- assertVisible: "QA Foco Reabre, 4 de 5 un, Falta 1"
